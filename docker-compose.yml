services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokemon_tcgp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon_tcgp}
      POSTGRES_DB: ${POSTGRES_DB:-pokemon_tcgp}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemon_tcgp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Resource limits so Postgres can't exhaust the host under this app's small dataset.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Isolated database used ONLY by the automated test suite (`npm test`).
  # Separate container, separate port, separate (tmpfs, non-persistent) storage -
  # completely independent from the `db` service above, which holds real user data.
  # Only starts when explicitly requested (`docker compose --profile test up -d db_test`),
  # never as part of a plain `docker compose up`.
  db_test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: pokemon_tcgp_test
      POSTGRES_PASSWORD: pokemon_tcgp_test
      POSTGRES_DB: pokemon_tcgp_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon_tcgp_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pokemon_tcgp}:${POSTGRES_PASSWORD:-pokemon_tcgp}@db:5432/${POSTGRES_DB:-pokemon_tcgp}?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Resource limits to cap CPU/memory usage of the Next.js container.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  db_data:
