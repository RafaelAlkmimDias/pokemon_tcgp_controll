[package]
name = "pokemon-tcgp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["file", "image", "webp"] }
sqlx = { version = "0.9.0", features = ["sqlite", "macros", "sqlite-bundled", "migrate", "runtime-tokio"] }
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.55", features = ["parsing", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.17.1"
