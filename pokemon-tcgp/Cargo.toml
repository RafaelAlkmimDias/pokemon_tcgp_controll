[package]
name = "pokemon-tcgp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["sqlite", "macros", "sqlite-bundled", "migrate", "runtime-tokio"] }
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.55", features = ["parsing", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
