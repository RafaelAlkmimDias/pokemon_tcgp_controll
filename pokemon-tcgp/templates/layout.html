<!doctype html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meta_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.5rem;
      line-height: 1.5;
    }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; }
    header nav a { margin-left: 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .subtitle { opacity: 0.75; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 1rem; }
    .card { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 0.5rem; padding: 1rem; }
    .card h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
    .stat-line { font-size: 0.9rem; opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <a href="/"><strong>{{ home_link }}</strong></a>
    <nav>
      <a href="/decks">{{ decks_link }}</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
